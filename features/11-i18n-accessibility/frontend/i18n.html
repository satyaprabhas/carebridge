<!-- Features: 11-i18n-accessibility | Frontend Template -->
<div id="i18n-module-root" class="accessibility-toolbar">
  <div class="lang-selector-wrap">
    <label for="lang-select" class="sr-only">Choose Language</label>
    <select id="lang-select" class="form-select">
      <option value="en" selected>English</option>
            <option value="te">తెలుగు (Telugu)</option>
    </select>
  </div>

  <!-- Audio Text-to-Speech Accessibility Toggle -->
  <button type="button" id="btn-toggle-speech" class="btn btn-outline btn-sm" title="Read instructions aloud">
    🔊 Read Aloud
  </button>
</div>
